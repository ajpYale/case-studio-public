<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Practice with Handsome Dan: interviewer and scorer agents">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/></marker>
  </defs>
  <style>
    .p-agent { fill: #00356b; } .p-agentt { fill: #fff; font-size: 14px; font-weight: 700; } .p-agents { fill: #cfe0f5; font-size: 11px; }
    .p-tool { fill: #fff; stroke: #5f712d; stroke-width: 2; } .p-toolt { fill: #3c4a1c; font-size: 13.5px; font-weight: 700; } .p-tools { fill: #4a4a4a; font-size: 11px; }
    .p-data { fill: #eef4fb; stroke: #286dc0; stroke-width: 1.5; stroke-dasharray: 4 3; } .p-datat { fill: #00254c; font-size: 12.5px; font-weight: 700; } .p-datas { fill: #4a4a4a; font-size: 11px; }
    .p-ln { stroke: #4a4a4a; stroke-width: 1.6; fill: none; marker-end: url(#pa); }
    .p-lbl { fill: #6b6b6b; font-size: 11px; }
  </style>
  <rect x="16" y="24" width="190" height="104" rx="6" fill="#fff" stroke="#978d85" stroke-width="1.5"/>
  <text x="111" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#1f1f1f">Candidate (browser)</text>
  <text x="111" y="70" text-anchor="middle" class="p-tools">sees only: the prompt, Handsome Dan's</text>
  <text x="111" y="85" text-anchor="middle" class="p-tools">messages, exhibits handed over</text>
  <text x="111" y="108" text-anchor="middle" class="p-tools" fill="#bd5319">no answer key · no title</text>

  <rect x="262" y="24" width="250" height="104" rx="6" class="p-agent"/>
  <text x="387" y="52" text-anchor="middle" class="p-agentt">Interviewer agent · Handsome Dan</text>
  <text x="387" y="72" text-anchor="middle" class="p-agents">sees the full interviewer guide</text>
  <text x="387" y="88" text-anchor="middle" class="p-agents">answers only from it · releases exhibits</text>
  <text x="387" y="104" text-anchor="middle" class="p-agents">hints on request · pushback · never the key</text>

  <rect x="572" y="24" width="270" height="104" rx="6" class="p-tool"/>
  <text x="707" y="52" text-anchor="middle" class="p-toolt">Leak guard + gates (code)</text>
  <text x="707" y="72" text-anchor="middle" class="p-tools">blocks results the candidate hasn't produced</text>
  <text x="707" y="88" text-anchor="middle" class="p-tools">(retry once, then redact) · exhibits only for</text>
  <text x="707" y="104" text-anchor="middle" class="p-tools">reached sections · parts only move forward</text>

  <path d="M206 64 L260 64" class="p-ln"/>
  <text x="212" y="56" class="p-lbl">message</text>
  <path d="M512 64 L570 64" class="p-ln"/>
  <text x="518" y="56" class="p-lbl">draft reply</text>
  <path d="M707 128 C707 170 140 170 111 130" class="p-ln"/>
  <text x="380" y="166" class="p-lbl">checked reply + newly released exhibits</text>

  <rect x="262" y="196" width="250" height="84" rx="6" class="p-agent"/>
  <text x="387" y="224" text-anchor="middle" class="p-agentt">Scorer agent</text>
  <text x="387" y="244" text-anchor="middle" class="p-agents">guide + transcript → rubric scores,</text>
  <text x="387" y="260" text-anchor="middle" class="p-agents">math check, verdict, what to fix</text>
  <path d="M111 130 L111 238 L260 238" class="p-ln"/>
  <text x="120" y="230" class="p-lbl">"Score my case"</text>

  <rect x="572" y="196" width="270" height="84" rx="6" class="p-data"/>
  <text x="707" y="224" text-anchor="middle" class="p-datat">Session file + meter</text>
  <text x="707" y="244" text-anchor="middle" class="p-datas">transcript · tokens and $ per call</text>
  <text x="707" y="260" text-anchor="middle" class="p-datas">$0.50 cap · 60-message cap · daily cap</text>
  <path d="M512 238 L570 238" class="p-ln"/>
</svg>
